name: pursapp
description: Aplikasi pengatur keuangan pribadi dengan penyimpanan lokal (memori HP).
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0 #agar dapat menyimpan data sebelumnya ketika update aplikasi
  google_sign_in: ^7.2.0
  http: ^1.6.0
  crypto: ^3.0.3
  supabase_flutter: ^2.18.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/